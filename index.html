<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau d'Études Charpente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Monde « tirage de bureau d'études » : fond bleu plan, traits clairs, signal ambre du crayon de charpentier. Un écran = une action. */
  --bg:#0d2340; --panel:#13305a; --well:#0a1b33; --line:#2c5185;
  --paper:#eef4fb; --muted:#9db6d6; --signal:#ffb547; --good:#47d394; --bad:#ff7a6b;
  --ax-x:#ff7a6b; --ax-y:#47d394; --ax-z:#6cb8ff;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--paper);font-family:var(--body);font-size:18px;
  background-image:linear-gradient(rgba(130,175,235,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(130,175,235,.07) 1px,transparent 1px);
  background-size:24px 24px;-webkit-tap-highlight-color:transparent}
#app{max-width:1180px;margin:0 auto;padding:16px 20px 128px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font:800 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font:600 13px var(--display);letter-spacing:.14em;color:var(--muted);margin-top:4px}
.xp{display:flex;align-items:center;gap:10px;background:var(--well);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px}
.xp b{font:700 18px var(--mono);background:var(--signal);color:#1d1400;border-radius:999px;padding:4px 10px}
.xp span{font:700 16px var(--display);letter-spacing:.06em;text-transform:uppercase}

.btn{min-height:56px;padding:0 22px;border-radius:14px;border:2px solid var(--line);background:var(--panel);
  font:700 20px var(--display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--signal);border-color:var(--signal);color:#1d1400}
.btn.ok{background:var(--good);border-color:var(--good);color:#04240f}
.btn.sm{min-height:48px;padding:0 16px;font-size:18px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.3;cursor:not-allowed}

/* Accueil */
.hero{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;margin:18px 0 22px;align-items:center}
.eyebrow{font:700 14px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--signal);margin:0 0 6px}
.hero h1{font:800 46px/1 var(--display);text-transform:uppercase;margin:0 0 16px;text-wrap:balance}
.namebox label{display:block;font:700 14px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.namebox input{width:100%;max-width:360px;font:700 24px var(--body);background:var(--well);color:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.hero .sub{color:var(--muted);font-size:18px;margin:14px 0}
.session{font:700 15px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;gap:10px;align-items:center}
.session:after{content:"";flex:1;height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;text-align:left;padding:18px;border-radius:18px;border:2px solid var(--line);background:var(--panel);cursor:pointer;min-height:132px;align-content:center}
.tile .num{grid-row:span 4;font:800 64px/1 var(--display);color:var(--signal)}
.tile h3{margin:0;font:800 28px/1.05 var(--display);text-transform:uppercase}
.tile .meta{color:var(--muted);font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 12px;border:2px solid var(--line);justify-self:start}
.chip.done{background:var(--good);border-color:var(--good);color:#04240f}
.chip.now{border-color:var(--signal);color:var(--signal)}
.tile.locked{opacity:.4;cursor:not-allowed}
.tile.locked .num{color:var(--muted)}
.tile.isdone{border-color:var(--good)}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

/* Étape */
.mtag{font:700 18px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mtag b{color:var(--paper)}
.segs{display:flex;gap:4px;margin:14px 0 4px}
.segs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.segs i.d{background:var(--good)}
.segs i.c{background:var(--signal)}
.objbar{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:10px;font-size:17px;color:var(--paper)}
.objbar b{font:800 14px var(--display);letter-spacing:.14em;text-transform:uppercase;color:#1d1400;background:var(--signal);border-radius:6px;padding:2px 8px}
.goal{border-left:4px solid var(--signal);padding:2px 0 2px 14px;margin:14px 0}
.goal .lbl{margin-top:0}
.goal .lead,.goal .sub{margin:0}
ul.outs{margin:4px 0 0;padding-left:22px;font-size:20px;font-weight:600;display:grid;gap:4px}
ul.outs li::marker{color:var(--signal)}
em.ex{font-style:normal;font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;background:var(--signal);color:#1d1400;border-radius:5px;padding:1px 6px;vertical-align:2px}
.row.ok.given .rl b:after{content:""}
.stage{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start;margin-top:14px}
.visual{background:rgba(10,27,51,.65);border:1px solid var(--line);border-radius:18px;padding:12px;position:sticky;top:12px}
.visual svg{width:100%;height:auto;display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.kicker{display:inline-flex;gap:8px;align-items:center;font:700 15px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin:0 0 6px}
.kicker em{font-style:normal;color:var(--paper);background:var(--well);border:1px solid var(--line);border-radius:6px;padding:2px 8px;letter-spacing:.06em}
h2{font:800 36px/1.02 var(--display);text-transform:uppercase;margin:0 0 12px;text-wrap:balance}
.lead{font-size:22px;line-height:1.35;margin:0 0 12px;font-weight:500}
.sub{color:var(--muted);font-size:18px;line-height:1.4;margin:0 0 12px}
.lbl{font:700 14px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}

.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.act{background:var(--paper);color:var(--bg);border-radius:8px;padding:6px 11px;font:700 18px var(--body)}
.sep{color:var(--signal);font:700 22px var(--display)}
ol.todo{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px;counter-reset:t}
ol.todo li{display:flex;gap:12px;align-items:flex-start;counter-increment:t}
ol.todo li:before{content:counter(t);flex:none;width:32px;height:32px;border-radius:50%;background:var(--signal);color:#1d1400;font:800 18px/32px var(--display);text-align:center}
ol.todo li .acts{padding-top:1px}

.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.val{background:var(--well);border:2px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.val b{display:block;font:800 16px var(--display);letter-spacing:.08em}
.val span{display:block;font:700 30px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.val.x b{color:var(--ax-x)} .val.y b{color:var(--ax-y)} .val.z b{color:var(--ax-z)}
.val.big{grid-column:1/-1}
.swatch{display:inline-flex;align-items:center;gap:10px;font:700 20px var(--body)}
.swatch i{width:34px;height:34px;border-radius:8px;border:2px solid var(--paper)}
.cutcard{border:2px dashed #cfe0f5;border-radius:14px;padding:12px;margin-top:10px;background:rgba(207,224,245,.05)}
.cutcard h4{margin:0 0 8px;display:flex;gap:10px;align-items:center;font:800 20px var(--display);text-transform:uppercase}
.cutcard h4 i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#cfe0f5;color:var(--bg);display:grid;place-items:center}
.cutcard .val span{font-size:22px}
.note{border-left:5px solid var(--signal);background:rgba(255,181,71,.09);border-radius:0 10px 10px 0;padding:10px 12px;margin-top:14px;font-size:18px}
.note.warn{border-color:var(--bad);background:rgba(255,122,107,.1)}
.note b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.doneBtn{width:100%;margin-top:18px;min-height:64px;font-size:24px}

.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}
.box{font:700 26px var(--mono);background:var(--well);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.box.good{border-color:var(--good);color:var(--good)}
.op{font:700 22px var(--mono);color:var(--signal)}
.eq{font:700 26px var(--mono);color:var(--muted)}
input.num{width:150px;font:700 30px var(--mono);background:var(--well);color:var(--paper);border:3px solid var(--signal);border-radius:12px;padding:8px 10px;text-align:center}
input.num:disabled{border-color:var(--good);color:var(--good);opacity:1}
input.num.sm{width:120px;font-size:24px;padding:6px 8px}
.unit{font:700 22px var(--display);color:var(--muted)}
.fb{min-height:30px;font:800 24px var(--display);letter-spacing:.04em;text-transform:uppercase;margin-top:10px}
.fb.ok{color:var(--good)} .fb.ko{color:var(--bad)}
.helpers{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hintbox{margin-top:10px;background:var(--well);border:2px solid var(--signal);border-radius:12px;padding:10px 12px;font-size:19px}
.hintbox b{color:var(--signal);font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.known{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.known span{font:700 17px var(--mono);background:var(--well);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.ptab{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.ptab div{background:var(--well);border:2px solid var(--line);border-radius:10px;text-align:center;padding:6px}
.ptab div b{display:block;font:700 16px var(--mono);color:var(--muted)}
.ptab div span{font:700 24px var(--mono)}
.ptab div.on{border-color:var(--signal)} .ptab div.on span{color:var(--signal)}

.rows{display:grid;gap:4px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.row .rl b{display:block;font:700 19px var(--body)}
.row .rl span{color:var(--muted);font:600 16px var(--mono)}
.row .rin{display:flex;align-items:center;gap:6px}
.row.ok .rl b:after{content:"  ✓";color:var(--good)}
.rowfb{grid-column:1/-1}
.rowfb .hintbox{margin-top:4px;font-size:17px}
.rowfb .bad{color:var(--bad);font:800 18px var(--display);text-transform:uppercase;letter-spacing:.04em}

.checks{display:grid;gap:10px;margin-top:6px}
.chk{display:flex;gap:14px;align-items:center;min-height:64px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--well);font:600 20px var(--body);cursor:pointer;text-align:left;width:100%}
.chk .cb{width:36px;height:36px;border:3px solid var(--muted);border-radius:9px;flex:none;display:grid;place-items:center;font:800 22px var(--display);color:#04240f}
.chk.on{border-color:var(--good)}
.chk.on .cb{background:var(--good);border-color:var(--good)}
.chef{margin-top:18px;border:2px solid var(--signal);border-radius:16px;padding:16px;background:rgba(255,181,71,.07)}
.chef h3{margin:0 0 6px;font:800 26px var(--display);text-transform:uppercase}
.chef .pinrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chef input{width:140px;letter-spacing:.3em}

.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(9,25,48,.95);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:5}
.nav-in{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.nav .count{font:700 18px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nav .btn{min-width:170px;min-height:62px;font-size:22px}

.modal{position:fixed;inset:0;background:rgba(4,12,26,.82);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{max-width:760px;width:100%;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.sheet h2{font-size:32px}
.lex{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lexi{background:var(--well);border:1px solid var(--line);border-radius:14px;padding:10px}
.lexi b{font:800 22px var(--display);text-transform:uppercase;color:var(--signal)}
.lexi p{margin:4px 0 0;font-size:17px}
.lexi svg{width:100%;height:auto;display:block;margin-top:6px}
.badge{display:grid;justify-items:center;text-align:center;gap:8px}
.badge svg{width:220px;height:auto}
.cert{border:3px double var(--signal);border-radius:16px;padding:22px;text-align:center;background:var(--well)}
.cert .who{font:800 44px/1 var(--display);text-transform:uppercase;margin:8px 0}
.xpfloat{position:fixed;right:24px;top:70px;font:800 30px var(--display);color:var(--signal);pointer-events:none;animation:up 1.1s ease-out forwards;z-index:20}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.hi{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:880px){
  .stage,.hero{grid-template-columns:1fr}
  .visual{position:static}
  .tiles,.lex{grid-template-columns:1fr}
  .hero h1{font-size:38px}
  h2{font-size:30px}
  .nav .btn{min-width:0;padding:0 16px}
}
.flds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.fld{background:var(--well);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.fld label{display:block;font:700 15px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fld .rin{display:flex;align-items:center;gap:6px}
.fld input.num{width:100%;min-width:0}
.fld.good{border-color:var(--good)}
.fld.bad{border-color:var(--bad)}
.fmsg{color:var(--bad);font:800 17px/1.2 var(--display);margin-top:6px}
.fld .hintbox{font-size:16px;padding:8px 10px}
textarea{width:100%;min-height:90px;background:var(--well);color:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px;font:500 13px var(--mono);word-break:break-all}
@media (max-width:520px){.flds{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
/* ---------- Réglages ---------- */
const PIN = "2020";           // code du chef d'atelier (enseignant)
const KEY = "bec-charpente-v2";

/* ---------- Géométrie de la ferme (cotes maquette en mm, X vers la droite, Z vers le haut) ---------- */
const OX = 40, OZ = 265;
const P = (x, z) => [+(x + OX).toFixed(1), +(OZ - z).toFixed(1)];
const pts = a => a.map(p => P(p[0], p[1]).join(",")).join(" ");
const R = (x1, z1, x2, z2) => [[x1, z1], [x2, z1], [x2, z2], [x1, z2]];
const MIR = a => a.map(p => [300 - p[0], p[1]]);
const ARB = [[0, 162], [12, 162], [145.5, 215.9], [145.5, 225.6], [0, 166.9]];
const CF = [[143.4, 169.9], [147.6, 174.1], [116.3, 205.4], [112.1, 201.2]];
const GEO = {
  potG: R(0, 0, 9, 150), potD: R(291, 0, 300, 150), entrait: R(0, 150, 300, 162),
  poincon: R(145.5, 162, 154.5, 232), arbG: ARB, arbD: MIR(ARB), cfG: CF, cfD: MIR(CF),
  raw: [[-9.9, 153], [152.3, 218.6], [148.9, 226.9], [-13.3, 161.3]]
};
const COL = { potG: "#c98a4b", potD: "#c98a4b", entrait: "#f2913d", poincon: "#f4cf4a", arbG: "#57d07a", arbD: "#57d07a", cfG: "#5ec8ff", cfD: "#5ec8ff", raw: "#57d07a" };
const CUTS = { about: R(-30, 140, 0, 240), niveau: R(-30, 132, 30, 162), aplomb: R(145.5, 140, 185.5, 250), cf: R(145.5, 160, 155.5, 200), mortaise: R(148.5, 156, 151.5, 162) };
const ALL = ["potG", "potD", "entrait", "cfG", "cfD", "poincon", "arbG", "arbD"];
const BASE = ["potG", "potD", "entrait"];
const ANG = {
  A: { v: [12, 162], a: [0, 22], r: 30, l: [48, 166] },
  C: { v: [145.5, 215.9], a: [202, 270], r: 13, l: [139, 205] },
  D: { v: [145.5, 215.9], a: [90, 202], r: 8, l: [134, 228] },
  E: { v: [145.5, 172], a: [90, 135], r: 12, l: [141, 187] },
  F: { v: [145.5, 172], a: [135, 180], r: 16, l: [127, 176] },
  G: { v: [114.2, 203.3], a: [-45, 22], r: 11, l: [127, 199] }
};
let uid = 0;
const rad = d => d * Math.PI / 180;
function T(x, z, s, o = {}) {
  const [a, b] = P(x, z);
  return `<text x="${a}" y="${b}" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="${o.w || 700}" font-size="${o.fs || 9}" fill="${o.c || "#eef4fb"}" text-anchor="${o.anchor || "middle"}" dominant-baseline="middle" ${o.halo ? 'stroke="#0a1b33" stroke-width="' + (o.fs || 9) * 0.28 + '" paint-order="stroke"' : ""}>${s}</text>`;
}
function dim(x1, z1, x2, z2, label, f, c = "#ffb547") {
  const a = P(x1, z1), b = P(x2, z2), t = 3.5 * f, horiz = Math.abs(z1 - z2) < 0.01;
  let s = `<g stroke="${c}" stroke-width="${0.9 * f}"><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
  if (horiz) s += `<line x1="${a[0]}" y1="${a[1] - t}" x2="${a[0]}" y2="${a[1] + t}"/><line x1="${b[0]}" y1="${b[1] - t}" x2="${b[0]}" y2="${b[1] + t}"/>`;
  else s += `<line x1="${a[0] - t}" y1="${a[1]}" x2="${a[0] + t}" y2="${a[1]}"/><line x1="${b[0] - t}" y1="${b[1]}" x2="${b[0] + t}" y2="${b[1]}"/>`;
  s += `</g>`;
  if (horiz) s += T((x1 + x2) / 2, z1 + 7 * f, label, { c, fs: 10 * f, halo: true });
  else s += T(x1 + 4 * f, (z1 + z2) / 2, label, { c, fs: 10 * f, anchor: "start", halo: true });
  return s;
}
function fermeInner(o, f) {
  const show = o.show || [], hi = o.hi || [], ghost = o.ghost || [], cuts = o.cuts || [], marks = o.marks || [];
  const id = "hatch" + (++uid);
  let s = `<defs><pattern id="${id}" width="${5 * f}" height="${5 * f}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="${5 * f}" stroke="#cfe0f5" stroke-width="${1.3 * f}" opacity=".75"/></pattern></defs>`;
  const g1 = P(-35, 0), g2 = P(335, 0);
  s += `<line x1="${g1[0]}" y1="${g1[1]}" x2="${g2[0]}" y2="${g2[1]}" stroke="#6f8fb8" stroke-width="${0.8 * f}" stroke-dasharray="${4 * f} ${3 * f}"/>`;
  for (const k of ["potG", "potD", "entrait", "cfG", "cfD", "poincon", "arbG", "arbD", "raw"]) {
    const on = show.includes(k), gh = ghost.includes(k) && !on;
    if (!on && !gh) continue;
    if (gh) { s += `<polygon points="${pts(GEO[k])}" fill="none" stroke="${COL[k]}" stroke-opacity=".5" stroke-width="${0.8 * f}" stroke-dasharray="${3 * f} ${2 * f}"/>`; continue; }
    const isHi = hi.includes(k), dimmed = hi.length && !isHi ? 0.45 : 1;
    s += `<polygon points="${pts(GEO[k])}" fill="${COL[k]}" opacity="${dimmed}" stroke="${isHi ? "#ffffff" : "#0a1b33"}" stroke-width="${(isHi ? 1.8 : 0.6) * f}" stroke-linejoin="round"${isHi ? ' class="hi"' : ""}/>`;
  }

/* ---------- État ---------- */
function def() { return { name: "", xp: 0, done: {}, pos: {}, solved: {}, open: false }; }
function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); return v && typeof v === "object" ? Object.assign(def(), v) : def(); } catch (e) { return def(); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
let S = load();
let cur = { view: "home" };
const ui = { tries: {}, hint: {}, sol: {}, fb: {}, vals: {}, bv: {}, fok: {}, bmsg: {} };

const fmt = v => String(v).replace(".", ",");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = s => { const t = String(s ?? "").replace(/\s/g, "").replace(",", ".").replace(/[^0-9.\-]/g, ""); return t === "" || t === "-" ? NaN : parseFloat(t); };
const rank = x => x < 200 ? "Apprenti traceur" : x < 450 ? "Traceur confirmé" : "Chef traceur";
const unlocked = i => S.open || i === 0 || !!S.done[MISSIONS[i - 1].id];
function addXP(n) {
  if (!n) return; S.xp += n; save();
  const d = document.createElement("div"); d.className = "xpfloat"; d.textContent = "+" + n + " XP"; document.body.appendChild(d); setTimeout(() => d.remove(), 1200);
}
const xpPill = () => `<div class="xp" aria-label="Points d'expérience"><b>${S.xp} XP</b><span>${rank(S.xp)}</span></div>`;
const encState = () => { try { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { return ""; } };
const decState = c => JSON.parse(decodeURIComponent(escape(atob(c.trim()))));

/* ---------- Accueil ---------- */
function heroVisual() {
  if (S.done.m3) return vPlan(195.5, 391).replace("Vue de dessus", "Vue de dessus");
  const show = [...(S.done.m1 ? BASE : []), ...(S.done.m2 ? ["poincon"] : [])];
  return ferme({ show, ghost: ALL });
}
function tile(m, i) {
  const ok = unlocked(i), done = S.done[m.id], st = S.pos[m.id] || 0;
  let chip = `<span class="chip">À faire</span>`;
  if (done) chip = `<span class="chip done">Validée · ${m.badge}</span>`;
  else if (!ok) chip = `<span class="chip">Verrouillée</span>`;
  else if (st > 0) chip = `<span class="chip now">Étape ${st + 1} / ${m.steps.length}</span>`;
  return `<button class="tile${ok ? "" : " locked"}${done ? " isdone" : ""}" data-act="open" data-m="${i}" ${ok ? "" : "disabled"}>
    <span class="num">0${m.n}</span><h3>${m.title}</h3><span class="meta">${m.goal.obj}</span><span class="meta">${m.maths} · environ 1 h 30</span>${chip}</button>`;
}

/* ---------- Étapes ---------- */
const chainHTML = c => `<div class="chain">${c.map(([t, k]) => `<span class="${k === "op" ? "op" : "box" + (k === "good" ? " good" : "")}">${t}</span>`).join("")}</div>`;
function bvals(st, k) {
  const o = {}, bv = ui.bv[k] || {}, fok = ui.fok[k] || {};
  for (const f of st.fields) o[f.k] = (S.solved[k] || fok[f.k]) ? f.ans : num(bv[f.k]);
  return o;
}
function stepOK(m, i) { return canNext(m, m.steps[i], m.id + "-" + i); }
const needs = st => ["calc", "multi", "build"].includes(st.type);
function bodyHTML(m, st, k) {
  const kick = (t, extra) => `<p class="kicker">${t}${extra ? ` <em>${extra}</em>` : ""}</p>`;
  if (st.type === "goal") {
    const g = m.goal;
    return kick("Mission " + m.n) + `<h2>${m.title}</h2>
      <div class="goal"><p class="lbl">Objectif</p><p class="lead">${g.obj}</p></div>
      <div class="goal"><p class="lbl">À quoi ça sert</p><p class="sub" style="color:var(--paper)">${g.use}</p></div>
      <div class="goal"><p class="lbl">À la fin, tu auras</p><ul class="outs">${g.out.map(x => `<li>${x}</li>`).join("")}</ul></div>`;
  }
  if (st.type === "brief") return kick("À savoir") + `<h2>${st.title}</h2><p class="lead">${st.text}</p>${st.sub ? `<p class="sub">${st.sub}</p>` : ""}`;
  if (st.type === "rule") {
    let s = kick("La règle d’or") + `<h2>${st.title}</h2><p class="lead">${st.text}</p>`;
    if (st.steps2) s += `<ol class="todo">${st.steps2.map(x => `<li><span style="font-size:20px;font-weight:600">${x}</span></li>`).join("")}</ol>`;
    (st.chains || []).forEach(c => s += chainHTML(c));
    if (st.table) s += `<p class="lbl">Table du charpentier</p><div class="ptab">${[["30 %", "17°"], ["40 %", "22°"], ["50 %", "27°"], ["100 %", "45°"]].map(([p, a]) => `<div class="${p === "40 %" ? "on" : ""}"><b>${p}</b><span>${a}</span></div>`).join("")}</div>`;
    if (st.note) s += `<div class="note">${st.note}</div>`;
    return s;
  }
  if (st.type === "calc") {
    const ok = S.solved[k], tries = ui.tries[k] || 0;
    let s = kick("Calcul", st.angle ? "Angle " + st.angle : "") + `<h2>${st.title}</h2><p class="lead">${st.q}</p>`;
    if (st.known) s += `<div class="known">${st.known.map(x => `<span>${x}</span>`).join("")}</div>`;
    s += `<div class="chain"><input class="num" id="ans" data-k="${k}" inputmode="decimal" autocomplete="off" aria-label="Ta réponse" value="${ok ? fmt(st.ans) : esc(ui.vals[k] || "")}" ${ok ? "disabled" : ""}><span class="unit">${st.unit}</span></div>`;
    if (!ok) s += `<button class="btn go" data-act="calc">Vérifier</button>`;
    s += `<div class="fb ${ok ? "ok" : ui.fb[k] ? "ko" : ""}" aria-live="polite">${ok ? (ui.fb[k] || "Cote juste. Passe à la suite.") : (ui.fb[k] || "")}</div>`;
    if (!ok) {
      s += `<div class="helpers"><button class="btn sm" data-act="hint">Coup de pouce</button>${tries >= 3 ? `<button class="btn sm ghost" data-act="sol">Voir la solution</button>` : ""}</div>`;
      if (ui.hint[k]) s += `<div class="hintbox"><b>Coup de pouce</b>${st.hint}</div>`;
    }
    return s;
  }
  if (st.type === "multi") {
    let s = kick("Fiche à remplir") + `<h2>${st.title}</h2><p class="sub">${st.text}</p><div class="rows">`;
    st.rows.forEach((r, i) => {
      const rk = k + "-" + i, ok = S.solved[rk] || r.given, tries = ui.tries[rk] || 0;
      s += `<div class="row${ok ? " ok" : ""}${r.given ? " given" : ""}"><div class="rl"><b>${r.label}${r.given ? ` <em class="ex">Exemple</em>` : ""}</b><span>${r.real}</span></div>
        <div class="rin"><input class="num sm" id="r-${i}" data-k="${rk}" data-r="${i}" inputmode="decimal" autocomplete="off" aria-label="${r.label}" value="${ok ? fmt(r.ans) : esc(ui.vals[rk] || "")}" ${ok ? "disabled" : ""}><span class="unit">${r.unit}</span></div>
        ${ok ? `<span class="unit" style="color:var(--good)">OK</span>` : `<button class="btn sm go" data-act="row" data-r="${i}">OK</button>`}
        <div class="rowfb">${!ok && ui.fb[rk] ? `<span class="bad">${ui.fb[rk]}</span>` : ""}${!ok && tries >= 1 ? `<div class="hintbox"><b>Coup de pouce</b>${r.hint}${tries >= 3 ? ` <button class="btn sm ghost" data-act="rowsol" data-r="${i}">Solution</button>` : ""}</div>` : ""}</div></div>`;
    });
    return s + `</div>`;
  }
  if (st.type === "build") {
    const ok = S.solved[k], bv = ui.bv[k] || {}, fok = ui.fok[k] || {}, msg = ui.bmsg[k] || {}, tries = ui.tries[k] || 0;
    let s = kick("Construction", st.fields[0].kind === "y" ? "Vue de dessus" : "Vue de face") + `<h2>${st.title}</h2><p class="lead">${st.text}</p>`;
    if (st.info) s += `<div class="known">${st.info.map(x => `<span>${x}</span>`).join("")}</div>`;
    s += `<div class="flds">` + st.fields.map(f => {
      const good = ok || fok[f.k], bad = !good && msg[f.k];
      return `<div class="fld${good ? " good" : bad ? " bad" : ""}"><label for="bf-${f.k}">${f.label}</label>
        <div class="rin"><input class="num sm" id="bf-${f.k}" data-bk="${f.k}" inputmode="decimal" autocomplete="off" value="${good ? fmt(f.ans) : esc(bv[f.k] ?? "")}" ${good ? "disabled" : ""}><span class="unit">${f.unit || "mm"}</span></div>
        ${bad ? `<div class="fmsg">${msg[f.k]}</div>` : ""}${bad && ui.hint[k] ? `<div class="hintbox"><b>Coup de pouce</b>${f.hint}</div>` : ""}</div>`;
    }).join("") + `</div>`;
    if (!ok) s += `<button class="btn go doneBtn" data-act="pose">${st.btn || "Poser la pièce"}</button>
      <div class="helpers">${tries >= 1 ? `<button class="btn sm" data-act="hint">Coup de pouce</button>` : ""}${tries >= 3 ? `<button class="btn sm ghost" data-act="bsol">Voir la solution</button>` : ""}</div>`;
    else s += `<div class="fb ok" aria-live="polite">${ui.fb[k] || "Pièce posée. Rien ne flotte."}</div>${st.after ? `<div class="note">${st.after}</div>` : ""}`;
    s += `<p style="margin-top:14px"><button class="btn sm ghost" data-act="fiche">Voir ma fiche de débit</button></p>`;
    return s;
  }
  if (st.type === "end") {
    const list = m.steps.map((x, i) => ({ x, i })).filter(o => needs(o.x));
    const todo = list.filter(o => !stepOK(m, o.i));
    let s = kick("Fiche de validation") + `<h2>Bilan de la mission ${m.n}</h2><p class="sub">L’appli a contrôlé ton travail.</p><div class="checks">`;
    list.forEach(o => { const d = stepOK(m, o.i); s += `<div class="chk${d ? " on" : ""}"><span class="cb">${d ? "✓" : ""}</span>${o.x.title}</div>`; });
    s += `</div>`;
    if (S.done[m.id]) s += `<div class="chef"><h3>Mission validée ✓</h3><p class="sub">Badge ${m.badge} obtenu.</p><button class="btn go" data-act="home">Retour aux missions</button>${m.n === 4 ? ` <button class="btn" data-act="cert">Mon certificat</button>` : ""}</div>`;
    else if (todo.length) s += `<div class="chef"><h3>Il te reste ${todo.length} étape${todo.length > 1 ? "s" : ""}</h3><button class="btn go" data-act="jump" data-s="${todo[0].i}">Y aller</button></div>`;
    else s += `<div class="chef"><h3>Tout est bon</h3><p class="sub">Toutes tes cotes sont justes, toutes tes pièces sont en place.</p><button class="btn go" data-act="validate">Valider la mission</button></div>`;
    return s;
  }
  return "";
}
function canNext(m, st, k) {
  if (st.type === "calc" || st.type === "build") return !!S.solved[k];
  if (st.type === "multi") return st.rows.every((r, i) => r.given || S.solved[k + "-" + i]);
  if (st.type === "end") return false;
  return true;
}
function visualOf(st, k) { return st.type === "build" ? st.draw(bvals(st, k)) : st.visual ? st.visual() : ""; }
function stepHTML() {
  const m = MISSIONS[cur.m], s = cur.s, st = m.steps[s], k = m.id + "-" + s;
  const segs = m.steps.map((_, i) => `<i class="${i < s ? "d" : i === s ? "c" : ""}"></i>`).join("");
  const last = s === m.steps.length - 1;
  return `<header class="top"><button class="btn sm" data-act="home">← Missions</button><div class="mtag">Mission ${m.n} · <b>${m.title}</b></div>${xpPill()}</header>
  <div class="segs" aria-hidden="true">${segs}</div>
  ${st.type === "goal" ? "" : `<div class="objbar"><b>Objectif</b>${m.goal.obj}</div>`}
  <div class="stage"><div class="visual" id="vis">${visualOf(st, k)}</div><div class="card">${bodyHTML(m, st, k)}</div></div>
  <nav class="nav"><div class="nav-in"><button class="btn" data-act="prev" ${s === 0 ? "disabled" : ""}>← Retour</button><span class="count">Étape ${s + 1} / ${m.steps.length}</span>
  ${last ? `<button class="btn" data-act="home">Missions</button>` : `<button class="btn go" data-act="next" ${canNext(m, st, k) ? "" : "disabled"}>Suivant →</button>`}</div></nav>`;
}

/* ---------- Rendu et actions ---------- */
function render(keepScroll) {
  document.querySelectorAll("input[data-k]").forEach(i => { if (!i.disabled) ui.vals[i.dataset.k] = i.value; });
  const y = window.scrollY;
  document.getElementById("app").innerHTML = cur.view === "home" ? homeHTML() : stepHTML();
  window.scrollTo(0, keepScroll ? y : 0);
}
const GOOD = ["Cote juste.", "Pile poil.", "Validé.", "Propre, comme au bureau d’études."];
const BAD = ["Pas encore. Recompte.", "Presque. Reprends le calcul.", "Pas la bonne cote."];
const pick = a => a[Math.floor(Math.random() * a.length)];
function judge(k, val, ans, tol) {
  const v = num(val);
  if (isNaN(v)) { ui.fb[k] = "Tape un nombre."; return false; }
  if (Math.abs(v - ans) <= (tol || 0.001)) {
    const t = ui.tries[k] || 0, used = ui.hint[k];
    S.solved[k] = true; ui.fb[k] = pick(GOOD); save();
    addXP(ui.sol[k] ? 0 : (t === 0 && !used ? 10 : 5));
    return true;
  }
  ui.tries[k] = (ui.tries[k] || 0) + 1; ui.fb[k] = pick(BAD); return false;
}
function modal(html) { document.getElementById("modal").innerHTML = html ? `<div class="modal" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>` : ""; }
function lexHTML() {
  return `<h2>Lexique du métier</h2><div class="lex">${LEX.map(([w, d, o]) => `<div class="lexi"><b>${w}</b><p>${d}</p>${o ? ferme(o) : ""}</div>`).join("")}</div><p style="margin-top:16px"><button class="btn go" data-act="close">Fermer</button></p>`;
}
function ficheHTML() {
  const m = MISSIONS[0], i = m.steps.findIndex(s => s.type === "multi"), st = m.steps[i];
  const rows = st.rows.map((r, j) => { const ok = r.given || S.solved["m1-" + i + "-" + j]; return `<div class="row"><div class="rl"><b>${r.label}</b><span>${r.real}</span></div><div class="rin"><span class="box${ok ? " good" : ""}">${ok ? fmt(r.ans) + " mm" : "?"}</span></div><span></span></div>`; }).join("");
  return `<h2>Ma fiche de débit</h2><div class="rows">${rows}</div><p style="margin-top:16px"><button class="btn go" data-act="close">Fermer</button></p>`;
}
function certHTML() {
  const d = new Date().toLocaleDateString("fr-FR");
  return `<div class="cert"><p class="eyebrow">Bureau d’Études Charpente</p><p class="sub">Certifie que</p><div class="who">${esc(S.name || "Dessinateur-traceur")}</div>
  <p class="lead">a conçu, taillé et chiffré une charpente à ferme latine : 3 fermes, échelle 1/20, devis 1 292 € HT.</p>
  <p class="sub">${S.xp} XP · ${rank(S.xp)} · ${d}</p></div><p class="sub" style="margin-top:12px">Fais une capture d’écran de ce certificat et envoie-la à ton professeur.</p><p><button class="btn go" data-act="close">Fermer</button></p>`;
}
function saveHTML() {
  return `<h2>Sauvegarde</h2><p class="sub">Ta progression reste sur cette tablette. Pour continuer ailleurs (à la maison, une autre tablette) : copie ce code et envoie-le-toi. Sur l’autre appareil, colle-le dans la case du bas.</p>
  <textarea id="code" readonly aria-label="Ton code de sauvegarde">${encState()}</textarea>
  <p><button class="btn go sm" data-act="copy">Copier mon code</button></p>
  <p class="lbl">Reprendre avec un code</p><textarea id="code2" aria-label="Colle ton code ici" placeholder="Colle ton code ici"></textarea>
  <p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm" data-act="loadcode">Reprendre</button><button class="btn sm ghost" data-act="close">Fermer</button></p><div class="fb" id="savefb" aria-live="polite"></div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "closebg" && e.target !== b) return;
  const m = MISSIONS[cur.m], st = m && m.steps[cur.s], k = m ? m.id + "-" + cur.s : "";
  switch (a) {
    case "open": { const i = +b.dataset.m; if (!unlocked(i)) return; cur = { view: "mission", m: i, s: Math.min(S.pos[MISSIONS[i].id] || 0, MISSIONS[i].steps.length - 1) }; render(); break; }
    case "home": modal(""); cur = { view: "home" }; render(); break;
    case "prev": if (cur.s > 0) { cur.s--; S.pos[m.id] = cur.s; save(); render(); } break;
    case "next": if (canNext(m, st, k) && cur.s < m.steps.length - 1) { cur.s++; S.pos[m.id] = cur.s; save(); render(); } break;
    case "jump": cur.s = +b.dataset.s; S.pos[m.id] = cur.s; save(); render(); break;
    case "calc": { const i = document.getElementById("ans"); judge(k, i.value, st.ans, st.tol); render(true); break; }
    case "hint": ui.hint[k] = true; render(true); break;
    case "sol": ui.sol[k] = true; S.solved[k] = true; ui.fb[k] = "Solution : " + fmt(st.ans) + " " + st.unit; save(); render(true); break;
    case "row": { const r = +b.dataset.r, rk = k + "-" + r, i = document.getElementById("r-" + r); judge(rk, i.value, st.rows[r].ans, st.rows[r].tol); render(true); break; }
    case "rowsol": { const r = +b.dataset.r, rk = k + "-" + r; ui.sol[rk] = true; S.solved[rk] = true; save(); render(true); break; }
    case "pose": {
      const bv = ui.bv[k] || (ui.bv[k] = {}), fok = ui.fok[k] || (ui.fok[k] = {}), msg = ui.bmsg[k] = {};
      let all = true;
      for (const f of st.fields) {
        if (fok[f.k]) continue;
        const v = num(bv[f.k]);
        if (isNaN(v)) { msg[f.k] = "Remplis cette case."; all = false; continue; }
        if (Math.abs(v - f.ans) <= (f.tol || 0.26)) fok[f.k] = true;
        else { all = false; msg[f.k] = MSG[f.kind][v > f.ans ? 0 : 1]; }
      }
      if (all) { S.solved[k] = true; save(); const t = ui.tries[k] || 0; addXP(ui.sol[k] ? 0 : (t === 0 && !ui.hint[k] ? 15 : 8)); ui.fb[k] = pick(["Pièce posée. Rien ne flotte.", "Pile en place.", "Assemblage propre."]); }
      else ui.tries[k] = (ui.tries[k] || 0) + 1;
      render(true); break;
    }
    case "bsol": { ui.sol[k] = true; const fok = ui.fok[k] || (ui.fok[k] = {}); st.fields.forEach(f => fok[f.k] = true); S.solved[k] = true; ui.fb[k] = "Voilà la solution. Regarde bien où va la pièce."; save(); render(true); break; }
    case "validate": {
      if (!m.steps.every((x, i) => !needs(x) || stepOK(m, i))) return;
      S.done[m.id] = true; save(); addXP(50); render(true);
      modal(`<div class="badge">${vBadge(m.n, m.badge)}<h2>Mission ${m.n} validée</h2><p class="lead">Badge ${m.badge} · +50 XP</p>
        ${m.n === 4 ? `<button class="btn go" data-act="cert">Voir mon certificat</button>` : `<button class="btn go" data-act="home">Mission suivante</button>`}</div>`);
      break;
    }
    case "cert": modal(certHTML()); break;
    case "lex": modal(lexHTML()); break;
    case "fiche": modal(ficheHTML()); break;
    case "save": modal(saveHTML()); break;
    case "copy": { const t = document.getElementById("code"); t.select(); const done = () => document.getElementById("savefb").innerHTML = `<span style="color:var(--good)">Code copié. Colle-le dans un mail ou sur l’ENT.</span>`; try { navigator.clipboard.writeText(t.value).then(done, () => { document.getElementById("savefb").textContent = "Copie impossible : sélectionne le code et copie-le à la main."; }); } catch (err) { document.getElementById("savefb").textContent = "Copie impossible : sélectionne le code et copie-le à la main."; } break; }
    case "loadcode": { try { const v = decState(document.getElementById("code2").value); if (!v || typeof v !== "object" || !("xp" in v)) throw 0; S = Object.assign(def(), v); save(); modal(""); cur = { view: "home" }; render(); } catch (err) { document.getElementById("savefb").innerHTML = `<span style="color:var(--bad)">Ce code ne marche pas. Vérifie que tu l’as collé en entier.</span>`; } break; }
    case "close": case "closebg": modal(""); break;
    case "chefopen": modal(`<h2>Chef d’atelier</h2><p class="sub">Réservé à l’enseignant : débloque toutes les missions (rattrapage, élève absent).</p><div style="display:flex;gap:10px;flex-wrap:wrap"><input class="num" id="pin2" type="password" inputmode="numeric" autocomplete="off" aria-label="Code du chef d’atelier"><button class="btn go" data-act="unlock">Débloquer</button><button class="btn ghost" data-act="close">Annuler</button></div><div class="fb ko" id="pinfb2" aria-live="polite"></div>`); break;
    case "unlock": if (document.getElementById("pin2").value.trim() === PIN) { S.open = true; save(); modal(""); render(); } else document.getElementById("pinfb2").textContent = "Code faux."; break;
    case "reset": modal(`<h2>Tout recommencer ?</h2><p class="lead">Tes points, tes badges et tes réponses seront effacés sur cette tablette.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="close">Non, garder</button><button class="btn go" data-act="doreset">Oui, effacer</button></div>`); break;
    case "doreset": S = def(); save(); for (const x in ui) ui[x] = {}; modal(""); cur = { view: "home" }; render(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const t = e.target;
  if (t.id === "ans") document.querySelector('[data-act="calc"]')?.click();
  else if (t.dataset && t.dataset.bk) document.querySelector('[data-act="pose"]')?.click();
  else if (t.dataset && t.dataset.r !== undefined && t.id.startsWith("r-")) document.querySelector(`[data-act="row"][data-r="${t.dataset.r}"]`)?.click();
  else if (t.id === "pin2") document.querySelector('[data-act="unlock"]')?.click();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "name") { S.name = t.value; save(); return; }
  if (t.dataset && t.dataset.bk && cur.view === "mission") {
    const m = MISSIONS[cur.m], st = m.steps[cur.s], k = m.id + "-" + cur.s;
    (ui.bv[k] || (ui.bv[k] = {}))[t.dataset.bk] = t.value;
    const v = document.getElementById("vis"); if (v) v.innerHTML = visualOf(st, k);
  }
});
render();
</script>
</body>
</html>
